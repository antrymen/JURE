module_specific_definition: exactly one strong eligible group and its specificity
  >= configured threshold
cross_module_definition: at least two strong eligible groups
sample_size_sensitive_definition: near-support-floor or high-support sample-size stratum;
  individual sensitivity not estimated
redundancy_definition: same target, response group and effect direction; descriptive
  sampling block only
